<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios Diários</title><link rel="stylesheet" href="../lite-shell.css"><style>
:root{--bg:#eef2f6;--panel:#fff;--panel2:#f8fafc;--text:#172033;--muted:#667085;--line:#d8dee8;--brand:#155eef;--ok:#087443;--warn:#b54708;--danger:#c43434;--shadow:0 10px 30px rgba(16,24,40,.08)}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:28px 18px 90px}.wrap{max-width:1120px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:30px}.head p{margin:5px 0 0;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);text-decoration:none;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.filters{display:grid;grid-template-columns:1.4fr repeat(2,.7fr);gap:10px;margin-bottom:14px}.filters input,.filters select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:14px Arial}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:17px}.stat{padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-weight:700}.stat b{font-size:25px}.list{display:grid;gap:11px}.report{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}.report-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.report h2{font-size:17px;margin:0}.badge{padding:5px 8px;border-radius:99px;background:var(--panel2);font-size:11px;font-weight:800}.ok{color:var(--ok)}.partial{color:var(--warn)}.cancel{color:var(--danger)}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:13px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.meta b{display:block;color:var(--text);margin-top:3px}.actions{display:flex;gap:8px}.note{position:fixed;right:14px;bottom:14px;color:var(--muted);font:700 9px Arial;letter-spacing:1px}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.filters,.stats{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.meta{grid-template-columns:1fr 1fr}}@media(max-width:460px){.filters,.stats,.meta{grid-template-columns:1fr}.filters input{grid-column:auto}.actions .btn{flex:1}}
</style></head><body><a class="fantastic-lite-back" href="../../portfolio.html">← Portfólio Fantastic</a><span class="fantastic-lite-label">VERSÃO LITE · DADOS FICTÍCIOS</span><main class="wrap"><div class="head"><div><h1>Relatórios Diários</h1><p>Acompanhamento dos registros enviados pelas equipes.</p></div><a class="btn primary" href="form.html?novo=1">+ Novo relatório</a></div><section class="filters"><input id="busca" placeholder="Buscar projeto, responsável ou município"><select id="status"><option value="">Todos os status</option><option>Projeto concluído</option><option>Parcial</option><option>Cancelado</option></select><select id="data"><option value="">Todas as datas</option><option>27/08/2026</option><option>26/08/2026</option></select></section><section class="stats"><div class="stat"><small>TOTAL</small><b>4</b></div><div class="stat"><small>CONCLUÍDOS</small><b>2</b></div><div class="stat"><small>PARCIAIS</small><b>1</b></div><div class="stat"><small>CANCELADOS</small><b>1</b></div></section><section class="list" id="lista"></section></main><span class="note">SIMULAÇÃO NAVEGÁVEL</span>
<script>const relatorios=[{id:1,data:'27/08/2026',responsavel:'Roberto e Nilson',projeto:'7705694',municipio:'Campinas',status:'Projeto concluído',execucao:100,placa:'TBI0H06'},{id:2,data:'27/08/2026',responsavel:'Rael e Rubson',projeto:'7707662',municipio:'Sumaré',status:'Parcial',execucao:70,placa:'FQE4A21'},{id:3,data:'26/08/2026',responsavel:'Equipe Técnica',projeto:'7707667',municipio:'Hortolândia',status:'Cancelado',execucao:0,placa:'GHT8B52'},{id:4,data:'26/08/2026',responsavel:'Anderson e Silvério',projeto:'7705410',municipio:'Valinhos',status:'Projeto concluído',execucao:100,placa:'DPA2C10'}];function render(){const q=busca.value.toLowerCase(),s=status.value,d=data.value;const itens=relatorios.filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!s||r.status===s)&&(!d||r.data===d));lista.innerHTML=itens.map(r=>`<article class="report"><div class="report-head"><div><h2>Projeto ${r.projeto}</h2><small>${r.responsavel}</small></div><span class="badge ${r.status==='Projeto concluído'?'ok':r.status==='Parcial'?'partial':'cancel'}">${r.status}</span></div><div class="meta"><div>Data<b>${r.data}</b></div><div>Município<b>${r.municipio}</b></div><div>Veículo<b>${r.placa}</b></div><div>Execução<b>${r.execucao}%</b></div></div><div class="actions"><a class="btn primary" href="form.html?id=${r.id}">Abrir relatório</a><button class="btn" onclick="alert('PDF demonstrativo: geração desativada na versão lite.')">Gerar PDF</button></div></article>`).join('')||'<p>Nenhum relatório encontrado.</p>'}busca.oninput=status.onchange=data.onchange=render;render();</script></body></html>
