<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha de Personagem | Knave</title><link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet"><style>
:root{--bg:#120c06;--card:#2a2015;--surface:#21170e;--text:#f2e6c9;--muted:#c3b38a;--gold:#d2a84a;--accent:#b08a3a;--line:#ffe6b426}*{box-sizing:border-box}body{margin:0;padding:30px 18px 100px;background:radial-gradient(circle at 50% -20%,#4b2c14,var(--bg) 44%);color:var(--text);font-family:'IM Fell English',serif}.top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{padding:10px 15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);text-decoration:none;font:700 14px 'IM Fell English';cursor:pointer}.save{background:var(--gold);color:#170e05}h1{text-align:center;color:var(--gold);font-size:clamp(38px,6vw,60px);margin:24px 0}.sheet{max-width:1200px;margin:auto}.section{margin-bottom:18px;padding:20px;background:linear-gradient(160deg,#302316,#21170e);border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 30px #0006}.section-title{display:block;margin-bottom:15px;color:var(--gold);font-size:22px}.top-grid{display:grid;grid-template-columns:220px 1fr;gap:20px}.portrait{height:220px;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:10px;background:#100a05;color:var(--muted);text-align:center;cursor:pointer}.portrait input{display:none}.character{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.field{display:grid;gap:5px}.field label{color:var(--muted);font-size:12px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;background:#100a05;color:#fff;font:16px 'IM Fell English'}textarea{min-height:110px;resize:vertical}.status-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px}.block h2{margin:0 0 12px;color:var(--muted);font-size:16px}.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.attr{text-align:center}.attr span{display:block;color:var(--muted);font:11px Arial}.attr input{text-align:center;font-size:20px}.combat,.magic{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.inventory-head{display:flex;justify-content:flex-end;gap:12px;margin-bottom:14px}.inventory-head .field{width:100px;text-align:center}.items{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.item{padding:10px;border:1px solid var(--line);border-radius:8px;background:#160e07}.item small{display:block;color:var(--muted);margin-bottom:6px}.item input{padding:8px}.item textarea{min-height:55px;padding:8px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lite{position:fixed;right:14px;bottom:14px;color:#9b8968;font:700 9px Arial;letter-spacing:1px}@media(max-width:850px){.top-grid,.status-grid{grid-template-columns:1fr}.portrait{height:150px}.items{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.character,.notes{grid-template-columns:1fr}.full{grid-column:1}.items{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><div class="top"><a class="btn" href="index.html">← Página inicial</a><button class="btn save" onclick="salvar()">Salvar ficha</button></div><h1>Ficha de Personagem</h1><main class="sheet">
<section class="section"><span class="section-title">Personagem</span><div class="top-grid"><label class="portrait" id="portrait">Clique para enviar<br>o retrato<input type="file" id="foto" accept="image/*"></label><div class="character"><div class="field"><label>Nome</label><input id="nome"></div><div class="field"><label>Título</label><input id="titulo"></div><div class="field full"><label>Profissões</label><input id="profissoes" placeholder="Profissões do personagem"></div><div class="field full"><label>Grupo</label><input id="grupo"></div></div></div></section>
<section class="section"><span class="section-title">Status do Personagem</span><div class="status-grid"><div class="block"><h2>Atributos</h2><div class="attrs" id="attrs"></div></div><div class="block"><h2>Vida & Combate</h2><div class="combat"><div class="field"><label>PV</label><input id="hp"></div><div class="field"><label>PV MAX</label><input id="hpMax"></div><div class="field"><label>CA</label><input id="ca"></div><div class="field"><label>PA</label><input id="pa" value="0"></div><div class="field"><label>Nível</label><input id="nivel" value="1"></div><div class="field"><label>XP</label><input id="xp" value="0"></div></div></div><div class="block"><h2>Magias & Bênçãos</h2><div class="magic"><div class="field"><label>Magias</label><input id="magias" value="0"></div><div class="field"><label>M. Máx.</label><input id="magiasMax" value="0"></div><div class="field"><label>Bênçãos</label><input id="bencaos" value="0"></div><div class="field"><label>B. Máx.</label><input id="bencaosMax" value="0"></div></div></div></div></section>
<section class="section"><span class="section-title">Inventário</span><div class="inventory-head"><div class="field"><label>Atual</label><input id="espacoAtual"></div><div class="field"><label>Extras</label><input id="espacoExtra" value="0"></div><div class="field"><label>Máximo</label><input id="espacoMax"></div></div><div class="items" id="items"></div></section>
<section class="section"><span class="section-title">Anotações</span><div class="notes"><div class="field"><label>Observações gerais</label><textarea id="observacoes"></textarea></div><div class="field"><label>Itens guardados / reserva</label><textarea id="reserva"></textarea></div></div></section></main><span class="lite">VERSÃO LITE · DADOS LOCAIS</span>
<script>const p=new URLSearchParams(location.search),pv=(p.get('pv')||'16/20').split('/'),esp=(p.get('espaco')||'6/12').split('/');nome.value=p.get('nome')||'';titulo.value=p.get('titulo')||'';grupo.value=p.get('grupo')||'';hp.value=pv[0];hpMax.value=pv[1];ca.value=p.get('ca')||14;espacoAtual.value=esp[0];espacoMax.value=esp[1];attrs.innerHTML=['FOR','DES','CON','INT','SAB','CAR'].map(a=>`<label class="attr"><span>${a}</span><input id="${a.toLowerCase()}" type="number" value="10"></label>`).join('');items.innerHTML=Array.from({length:10},(_,i)=>`<div class="item"><small>Item ${String(i+1).padStart(2,'0')}</small><input id="item${i+1}" placeholder="Nome do item"><textarea id="desc${i+1}" placeholder="Descrição"></textarea></div>`).join('');foto.onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{portrait.innerHTML='';portrait.append(img);img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:8px'};img.src=URL.createObjectURL(f)};function salvar(){const dados=Object.fromEntries([...document.querySelectorAll('input,textarea')].filter(e=>e.id&&e.type!=='file').map(e=>[e.id,e.value]));localStorage.setItem('knave-lite-'+(nome.value||'nova'),JSON.stringify(dados));alert('Ficha salva nesta demonstração.')}</script></body></html>
