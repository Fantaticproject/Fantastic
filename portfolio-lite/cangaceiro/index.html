<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cangaceiros | Ficha de RPG</title><link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet"><link rel="stylesheet" href="../lite-shell.css"><style>:root{--bg:#120c06;--card:#2a2015;--text:#f2e6c9;--muted:#c3b38a;--accent:#b08a3a;--gold:#d2a84a;--line:#ffe6b426}*{box-sizing:border-box}body{margin:0;padding:48px 20px 90px;background:radial-gradient(circle at 50% -20%,#4b2c14,var(--bg) 48%);color:var(--text);font-family:'IM Fell English',serif;min-height:100vh}header{text-align:center}h1{margin:0;color:var(--gold);font-size:clamp(42px,7vw,72px);text-shadow:0 3px 15px #000;letter-spacing:2px}header p{margin:5px 0 28px;color:var(--muted);font-size:18px}.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:32px}.tabs{display:flex;gap:8px}.tab,.new-btn{padding:10px 18px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);font:700 16px 'IM Fell English';cursor:pointer}.tab.active{background:var(--accent);color:#130c05}.new-btn{background:var(--gold);color:#160e06;border:0}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:22px}.sheet{position:relative;padding:20px;background:linear-gradient(160deg,#302316,#21170e);border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 30px #0008;cursor:pointer;transition:.25s}.sheet:hover{transform:translateY(-7px);border-color:var(--gold)}.portrait{width:94px;height:94px;margin:0 auto 13px;display:grid;place-items:center;border:2px solid var(--accent);border-radius:50%;background:radial-gradient(circle,#654326,#160e07);font:700 27px Arial;color:#f2d89c}.info{text-align:center}.info strong{display:block;font-size:23px}.info em{display:block;min-height:24px;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.stat{text-align:center}.stat small{display:block;color:var(--muted);font:10px Arial}.stat b{color:var(--gold);font-size:18px}.empty{grid-column:1/-1;padding:60px;text-align:center;border:1px dashed var(--line);color:var(--muted)}.modal{display:none;position:fixed;inset:0;z-index:100;background:#000d;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{width:min(560px,100%);max-height:92vh;overflow:auto;padding:27px;background:linear-gradient(160deg,#332416,#1d130c);border:2px solid var(--accent);border-radius:15px;box-shadow:0 25px 80px #000}.modal-card h2{margin:0 0 20px;color:var(--gold);font-size:30px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:13px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;background:#100a05;color:#fff;font:16px 'IM Fell English'}.field textarea{min-height:85px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.modal-actions button{padding:11px 17px;border:1px solid var(--line);border-radius:7px;background:#2a2015;color:#fff;font:700 15px 'IM Fell English';cursor:pointer}.modal-actions .save{background:var(--gold);color:#160e06}.view-list{list-style:none;padding:0}.view-list li{padding:10px 0;border-bottom:1px solid var(--line)}.view-list b{color:var(--gold)}.disclaimer{position:fixed;right:14px;bottom:14px;color:#9b8968;font:700 9px Arial;letter-spacing:1px}@media(max-width:560px){body{padding:75px 14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:1}.grid{grid-template-columns:1fr}.disclaimer{display:none}}</style></head><body><a class="fantastic-lite-back" href="../../portfolio.html">← Portfólio Fantastic</a><span class="fantastic-lite-label">VERSÃO LITE · NÃO SALVA</span><header><h1>Cangaceiros</h1><p>Fichas de RPG e organização do bando</p></header><div class="toolbar"><div class="tabs" id="tabs"></div><button class="new-btn" id="newButton">+ Criar ficha</button></div><main class="grid" id="grid"></main>
<div class="modal" id="formModal"><form class="modal-card" id="sheetForm"><h2>Nova ficha de cangaceiro</h2><div class="form-grid"><div class="field"><label>Nome</label><input name="nome" required placeholder="Ex.: Maria Fagulha"></div><div class="field"><label>Título</label><input name="titulo" required placeholder="Ex.: Dona das Rotas"></div><div class="field"><label>Bando</label><select name="bando"><option>Bando da Serra</option><option>Rota do Norte</option></select></div><div class="field"><label>PV atual / máximo</label><input name="pv" value="16/20" pattern="[0-9]+/[0-9]+"></div><div class="field"><label>Classe de armadura</label><input name="ca" type="number" value="14" min="1" max="30"></div><div class="field"><label>Espaço usado / máximo</label><input name="espaco" value="6/12" pattern="[0-9]+/[0-9]+"></div><div class="field full"><label>História curta</label><textarea name="historia" placeholder="De onde veio e o que procura no sertão?"></textarea></div></div><div class="modal-actions"><button type="button" data-close>Cancelar</button><button class="save" type="submit">Criar ficha</button></div></form></div>
<div class="modal" id="viewModal"><div class="modal-card"><h2 id="viewName"></h2><ul class="view-list" id="viewData"></ul><div class="modal-actions"><button type="button" data-close>Fechar</button></div></div></div>
<script>let sheets=[{nome:'Lua Branca',titulo:'Rastreadora do Sertão',bando:'Bando da Serra',pv:'18/20',ca:14,espaco:'7/12',historia:'Conhece cada trilha escondida da caatinga.'},{nome:'Zé Cascavel',titulo:'Pistoleiro da Caatinga',bando:'Bando da Serra',pv:'16/16',ca:13,espaco:'9/14',historia:'Rápido no gatilho e lento para confiar.'},{nome:'Maria Fagulha',titulo:'Dona das Rotas',bando:'Rota do Norte',pv:'14/18',ca:15,espaco:'5/10',historia:'Carrega mapas que não existem em papel.'}];let current='Bando da Serra';const $=s=>document.querySelector(s);function render(){const bands=[...new Set(sheets.map(x=>x.bando))];document.querySelector("#tabs").innerHTML=bands.map(b=>`<button class="tab ${b===current?'active':''}" data-band="${b}">${b}</button>`).join('');const visible=sheets.filter(x=>x.bando===current);document.querySelector("#grid").innerHTML=visible.length?visible.map((f,i)=>`<article class="sheet" data-name="${f.nome}"><div class="portrait">${f.nome.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="info"><strong>${f.nome}</strong><em>${f.titulo}</em></div><div class="stats"><div class="stat"><small>PV</small><b>${f.pv}</b></div><div class="stat"><small>CA</small><b>${f.ca}</b></div><div class="stat"><small>ESPAÇO</small><b>${f.espaco}</b></div></div></article>`).join(''):'<div class="empty">Nenhuma ficha neste bando. Crie a primeira.</div>';document.querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{current=b.dataset.band;render()});document.querySelectorAll('.sheet').forEach(card=>card.onclick=()=>openSheet(card.dataset.name))}function openSheet(name){const f=sheets.find(x=>x.nome===name);document.querySelector("#viewName").textContent=f.nome;document.querySelector("#viewData").innerHTML=`<li><b>Título:</b> ${f.titulo}</li><li><b>Bando:</b> ${f.bando}</li><li><b>PV:</b> ${f.pv} · <b>CA:</b> ${f.ca} · <b>Espaço:</b> ${f.espaco}</li><li><b>História:</b> ${f.historia||'Não informada'}</li>`;document.querySelector("#viewModal").classList.add('open')}document.querySelector("#newButton").onclick=()=>document.querySelector("#formModal").classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));document.querySelector("#sheetForm").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.ca=Number(d.ca);sheets.push(d);current=d.bando;e.target.reset();document.querySelector("#formModal").classList.remove('open');render()};document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});render();</script></body></html>
